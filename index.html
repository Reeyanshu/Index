<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
    }

    .scene {
        width: 420px;
        height: 420px;
        perspective: 1000px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s;
    }

    .card.flip {
        transform: rotateY(180deg);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(14px);
        border-radius: 30px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
    }

    .back {
        transform: rotateY(180deg);
    }

    h1 {
        color: white;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 18px;
        text-shadow:
            0 0 10px rgba(255,255,255,0.8),
            0 0 20px rgba(255,105,135,0.9);
    }

    p {
        color: white;
        font-size: 18px;
        font-weight: 400;
        margin-bottom: 20px;
        min-height: 32px;
        text-shadow:
            0 0 6px rgba(255,255,255,0.7),
            0 0 12px rgba(255,120,150,0.8);
    }

    .buttons {
        display: flex;
        gap: 16px;
        margin-top: 10px;
    }

    button {
        border: none;
        border-radius: 45px;
        padding: 16px 38px;
        font-size: 18px;
        font-family: 'Poppins', sans-serif;
        cursor: pointer;
        transition: all 0.35s ease;
    }

    #yes {
        background: linear-gradient(135deg, #ff1744, #ff4d6d);
        color: white;
        font-weight: 600;
        font-size: 20px;
        box-shadow:
            0 0 15px rgba(255, 23, 68, 0.9),
            0 0 30px rgba(255, 77, 109, 0.8);
    }

    #no {
        background: white;
        color: #ff1744;
        font-weight: 600;
    }

    .hearts {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
        }
        to {
            transform: translateY(-10vh);
        }
    }
</style>
</head>

<body>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine? 💖</h1>
            <p id="message">You Make My World Brighter Every Single Day ✨</p>

            <div class="buttons">
                <button id="yes">YES 💖</button>
                <button id="no">NO 😜</button>
            </div>
        </div>

        <!-- BACK -->
        <div class="side back">
            <h1>YAYYYY I KNEW IT 💕</h1>
            <p>
                You just Made My Heart The Happiest 🥹💖<br><br>
                I Promise To Make You Smile Every Day 💘<br><br>
                I Love You Endlessly 💞
            </p>
        </div>

    </div>
</div>

<script>
    const noMessages = [
        "Are You Sure? 🥺",
        "Think Again 😢",
        "My Heart Is Breaking 💔",
        "Pleaseeee 🥹",
        "Last Chance 😭",
        "Okay… Now You HAVE To Say Yes 😤"
    ];

    let noCount = 0;
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("message");
    const card = document.getElementById("card");

    noBtn.addEventListener("click", () => {
        if (noCount < noMessages.length) {
            msg.innerText = noMessages[noCount];
            noCount++;
            let scale = 1 + noCount * 0.2;
            yesBtn.style.transform = `scale(${scale})`;
        }
    });

    yesBtn.addEventListener("click", () => {
        card.classList.add("flip");
    });

    // floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "hearts";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 22 + 12) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 280);
</script>

</body>
</html>
