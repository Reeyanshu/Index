<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

/* CARD */
.scene {
    width: 360px;
    height: 360px;
    perspective: 1000px;
    z-index: 2;
}

.card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s;
}

.card.flip {
    transform: rotateY(180deg);
}

.side {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(14px);
    border-radius: 30px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    backface-visibility: hidden;
    padding: 24px;
    text-align: center;
}

.front {
    justify-content: space-between;
}

.back {
    transform: rotateY(180deg);
    justify-content: center;
}

/* MAIN TEXT */
h1 {
    font-size: 44px;
    color: white;
    margin-top: -10px;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff4d6d,
        0 0 35px #ff1744;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 20px;
    margin-top: 10px;
}

button {
    border: none;
    border-radius: 50px;
    padding: 20px 45px;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Playfair Display', serif;
}

#yes {
    background: #ff1744;
    color: white;
    box-shadow: 0 0 30px rgba(255,23,68,1);
}

#no {
    background: white;
    color: #ff1744;
}

/* NO MESSAGE AT BOTTOM */
#message {
    font-size: 24px;
    color: white;
    margin-bottom: 10px;
    min-height: 40px;
    text-shadow:
        0 0 8px #fff,
        0 0 15px #ff4d6d;
}

/* BACK TEXT */
.back h1 {
    font-size: 42px;
}

.back p {
    font-size: 22px;
    color: white;
    text-shadow: 0 0 12px rgba(255,255,255,0.9);
}

/* HEARTS */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 6s linear infinite;
    opacity: 0.8;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* FIREWORK PARTICLES */
.firework {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: fly 1s ease-out forwards;
}

@keyframes fly {
    from {
        transform: translate(0, 0);
        opacity: 1;
    }
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine?</h1>

            <div class="buttons">
                <button id="yes">Yes 💖</button>
                <button id="no">No 😜</button>
            </div>

            <div id="message"></div>
        </div>

        <!-- BACK -->
        <div class="side back">
            <h1>Yayyyy 💕</h1>
            <p>
                I Knew It 🥹💖<br><br>
                You Just Made My World Complete 💘<br><br>
                I Love You Forever 💞
            </p>
        </div>

    </div>
</div>

<script>
const noMessages = [
    "Are You Serious? 😳",
    "Please Think Again 🥺",
    "My Heart Is Cracking 💔",
    "This Is Hurting 😭",
    "I’m Still Not Giving Up 😤",
    "Okay… You Love Me, I Know 😌"
];

let noCount = 0;
let fireworkInterval = null;

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("message");
const card = document.getElementById("card");

noBtn.addEventListener("click", () => {
    if (noCount < noMessages.length) {
        msg.innerText = noMessages[noCount];
        noCount++;
        yesBtn.style.transform = `scale(${1 + noCount * 0.25})`;
    }
});

yesBtn.addEventListener("click", () => {
    card.classList.add("flip");
    startFireworks();
});

/* LOOPING FIREWORKS */
function startFireworks() {
    if (fireworkInterval) return;

    fireworkInterval = setInterval(() => {
        const centerX = Math.random() * window.innerWidth;
        const centerY = Math.random() * window.innerHeight;

        for (let i = 0; i < 25; i++) {
            const p = document.createElement("div");
            p.className = "firework";

            const angle = Math.random() * 2 * Math.PI;
            const distance = Math.random() * 160;

            p.style.left = centerX + "px";
            p.style.top = centerY + "px";
            p.style.background =
                `hsl(${Math.random() * 360}, 100%, 60%)`;

            p.style.setProperty("--x", Math.cos(angle) * distance + "px");
            p.style.setProperty("--y", Math.sin(angle) * distance + "px");

            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }
    }, 800);
}

/* FLOATING HEARTS */
setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (Math.random() * 20 + 14) + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
}, 350);
</script>

</body>
</html>
