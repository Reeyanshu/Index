<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<!-- Romantic Elegant Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Playfair Display', serif;
        overflow: hidden;
    }

    .scene {
        width: 460px;
        height: 460px;
        perspective: 1200px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s ease;
    }

    .card.flip {
        transform: rotateY(180deg);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(16px);
        border-radius: 32px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px;
        box-sizing: border-box;
        text-align: center;
        backface-visibility: hidden;
    }

    .back {
        transform: rotateY(180deg);
    }

    h1 {
        font-size: 34px;
        color: white;
        margin-bottom: 18px;
        text-shadow:
            0 0 8px rgba(255,255,255,0.9),
            0 0 18px rgba(255,120,150,0.9);
    }

    p {
        font-size: 22px;
        color: white;
        min-height: 40px;
        margin-bottom: 26px;
        text-shadow:
            0 0 6px rgba(255,255,255,0.8),
            0 0 14px rgba(255,140,170,0.9);
    }

    .buttons {
        display: flex;
        gap: 18px;
    }

    button {
        border: none;
        border-radius: 50px;
        padding: 16px 40px;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.35s ease;
        font-family: 'Playfair Display', serif;
    }

    #yes {
        background: linear-gradient(135deg, #ff1744, #ff4d6d);
        color: white;
        font-size: 22px;
        box-shadow:
            0 0 15px rgba(255, 23, 68, 0.9),
            0 0 35px rgba(255, 77, 109, 0.9);
    }

    #no {
        background: white;
        color: #ff1744;
        font-size: 18px;
    }

    .heart {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes float {
        from { transform: translateY(100vh); }
        to { transform: translateY(-10vh); }
    }
</style>
</head>

<body>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine? 💖</h1>
            <p id="message">You Make My World Brighter Every Single Day ✨</p>

            <div class="buttons">
                <button id="yes">Yes 💖</button>
                <button id="no">No 😜</button>
            </div>
        </div>

        <!-- BACK -->
        <div class="side back">
            <h1>Yayyy! I Knew It 💕</h1>
            <p>
                You Just Made My Heart The Happiest 💖<br><br>
                I Promise To Make You Smile Every Day ✨<br><br>
                I Love You Endlessly 💞
            </p>
        </div>

    </div>
</div>

<script>
    const noMessages = [
        "Are You Serious? 😲",
        "Please Think Again 🥺",
        "This Is Breaking My Heart 💔",
        "You Are Playing With Me 😢",
        "Okay… This Is Getting Painful 😭",
        "Now You Have No Choice 😤"
    ];

    let count = 0;
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("message");
    const card = document.getElementById("card");

    noBtn.addEventListener("click", () => {
        if (count < noMessages.length) {
            msg.innerText = noMessages[count];
            count++;
            yesBtn.style.transform = `scale(${1 + count * 0.25})`;
        }
    });

    yesBtn.addEventListener("click", () => {
        card.classList.add("flip");
    });

    // floating hearts
    setInterval(() => {
        const h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "💖";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (Math.random() * 22 + 14) + "px";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6000);
    }, 300);
</script>

</body>
</html>
