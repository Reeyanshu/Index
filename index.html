<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff7a9e, #ff4f7b);
    font-family: 'Playfair Display', serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔥 FIREWORKS CANVAS */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
}

.scene {
    position: relative;
    z-index: 2;
    perspective: 1000px;
}

.card {
    width: 320px;
    padding: 40px 25px 50px;
    background: rgba(255, 192, 203, 0.35);
    border-radius: 22px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    transition: transform 1s;
}

.card.flip {
    transform: rotateY(180deg);
}

h1 {
    margin-top: -10px;
    font-size: 32px;
    color: white;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
}

.buttons {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    padding: 16px 32px;
    font-size: 20px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    transition: 0.3s ease;
    font-family: 'Playfair Display', serif;
}

#yesBtn {
    background: #ff1f5a;
    color: white;
    box-shadow: 0 0 20px rgba(255,31,90,0.9);
}

#noBtn {
    background: white;
    color: #ff1f5a;
}

#noMsg {
    margin-top: 35px;
    font-size: 20px;
    color: white;
    min-height: 30px;
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

#finalMsg {
    display: none;
    font-size: 28px;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,1);
}
</style>
</head>

<body>

<!-- 🔥 STEP 1: FIREWORKS CANVAS -->
<canvas id="fireworks"></canvas>

<div class="scene">
    <div class="card" id="card">
        <h1>Muskan, Will You Be My Valentine?</h1>

        <div class="buttons">
            <button id="yesBtn">Yes 💖</button>
            <button id="noBtn">No 😜</button>
        </div>

        <div id="noMsg"></div>
        <div id="finalMsg">Yayyy! 🎉 I Knew It 💕<br>You Just Made My World Complete 💖</div>
    </div>
</div>

<script>
/* 💬 NO BUTTON LOGIC */
const noMessages = [
    "Are You Sure? 🥺",
    "Think Again 💗",
    "You’re Breaking My Heart 💔",
    "Just Click Yes Already 😭",
    "I’ll Be The Happiest Person 🥹",
    "Last Chance 😌"
];

let noCount = 0;
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const noMsg = document.getElementById("noMsg");
const finalMsg = document.getElementById("finalMsg");
const card = document.getElementById("card");

noBtn.addEventListener("click", () => {
    if (noCount < noMessages.length) {
        noMsg.textContent = noMessages[noCount];
        yesBtn.style.transform = `scale(${1 + noCount * 0.15})`;
        noCount++;
    }
});

/* 💖 YES CLICK */
yesBtn.addEventListener("click", () => {
    card.classList.add("flip");
    noMsg.style.display = "none";
    finalMsg.style.display = "block";
    startFireworks();
});

/* 🎆 REAL FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fireworks = [];

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createFirework() {
    const x = random(100, canvas.width - 100);
    const y = random(100, canvas.height / 2);
    const colors = ["#ff004c", "#ffcc00", "#00eaff", "#ffffff", "#ff6eff"];

    for (let i = 0; i < 80; i++) {
        fireworks.push({
            x,
            y,
            angle: Math.random() * Math.PI * 2,
            speed: random(2, 6),
            radius: 2,
            alpha: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function animateFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    fireworks.forEach((p, i) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.015;

        ctx.fillStyle = `rgba(${hexToRgb(p.color)},${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) fireworks.splice(i, 1);
    });

    requestAnimationFrame(animateFireworks);
}

function hexToRgb(hex) {
    const bigint = parseInt(hex.replace("#",""), 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `${r},${g},${b}`;
}

function startFireworks() {
    setInterval(createFirework, 700);
    animateFireworks();
}
</script>

</body>
</html>
