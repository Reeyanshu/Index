<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
    .final-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 18px;
}

.final-text .line {
    color: white;
    font-size: 24px;
    text-align: center;
    text-shadow: 
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.6);
}

.final-text .big {
    font-size: 36px;
    font-weight: 700;
    text-shadow:
        0 0 15px rgba(255,255,255,1),
        0 0 30px rgba(255,182,193,0.9);
}

    .hearts {
    position: fixed;
    bottom: -10px;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.heart {
    position: absolute;
    bottom: 0;
    font-size: 22px;
    opacity: 0.8;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh) scale(1.2);
        opacity: 0;
    }
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Playfair Display', serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* FIREWORK CANVAS */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
}

/* CARD STRUCTURE */
.scene {
    perspective: 1200px;
    z-index: 2;
}

.card {
    width: 320px;
    height: 360px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s ease;
}

.card.flip {
    transform: rotateY(180deg);
}

.side {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    background: rgba(255, 192, 203, 0.35);
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    backface-visibility: hidden;
    padding: 35px 25px;
    text-align: center;
}

/* FRONT */
.front h1 {
    font-size: 32px;
    color: white;
    margin-bottom: 60px;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    border: none;
    cursor: pointer;
    padding: 18px 44px;
    font-size: 22px;
    border-radius: 40px;
    transition: all 0.3s ease;
}

#yesBtn {
    background: #ff1744;
    color: white;
    box-shadow: 0 0 20px rgba(255,23,68,0.9);
}

#noBtn {
    background: white;
    color: #ff1744;
}

/* NO MESSAGE */
#noMsg {
    position: absolute;
    bottom: 25px;
    width: 100%;
    left: 0;
    font-size: 22px;
    color: white;
    text-shadow: 0 0 12px rgba(255,255,255,0.9);
}

/* BACK */
.back {
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
}
.back h1 {
    color: white;
    font-size: 34px;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255,255,255,1);
}

.back p {
    color: white;
    font-size: 22px;
    line-height: 1.6;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
}

.back h2 {
    font-size: 30px;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,1);
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>
<div class="hearts"></div>

<div class="scene">
    <div class="card" id="card">
        
        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine?</h1>

            <div class="buttons">
                <button id="yesBtn">Yes 💖</button>
                <button id="noBtn">No 😜</button>
            </div>

            <div id="noMsg"></div>
        </div>

        <!-- BACK -->
<div class="side back">
    <div class="final-text">
        <div class="line big">Yayyyy 💕</div>
        <div class="line">I Knew It 🥹</div>
        <div class="line">I Love You Forever 💞</div>
    </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const noMsg = document.getElementById("noMsg");
const card = document.getElementById("card");

let noCount = 0;
const noTexts = [
   "Are You Serious? 😳",
    "Please Think Again 🥺",
    "My Heart Is Breaking 💔",
    "This Is Hurting 😭",
    "I’m Still Not Giving Up 😤",
    "Okay… You Love Me, I Know 😌"
];

noBtn.addEventListener("click", () => {
    if (noCount < noTexts.length) {
        noMsg.textContent = noTexts[noCount];
        noCount++;

        let scale = 1 + noCount * 0.15;
        yesBtn.style.transform = `scale(${scale})`;
    }
});

yesBtn.addEventListener("click", () => {
    card.classList.add("flip");
    startFireworks();
});

/* REAL FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fireworks = [];

function startFireworks() {
    setInterval(() => {
        fireworks.push(new Firework());
    }, 300);
}

class Firework {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height * 0.5;
        this.particles = [];

        for (let i = 0; i < 40; i++) {
            this.particles.push({
                x: this.x,
                y: this.y,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 5 + 2,
                life: 100,
                color: `hsl(${Math.random()*360},100%,60%)`
            });
        }
    }

    update() {
        this.particles.forEach(p => {
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;
            p.life--;
        });
    }

    draw() {
        this.particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
    }
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    fireworks.forEach((f, i) => {
        f.update();
        f.draw();
        if (f.particles[0].life <= 0) fireworks.splice(i,1);
    });
    requestAnimationFrame(animate);
}

animate();
    const heartsContainer = document.querySelector(".hearts");

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";

    heartsContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
