<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Calibri, sans-serif;
        overflow: hidden;
    }

    .scene {
        width: 420px;
        height: 420px;
        perspective: 1000px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s;
    }

    .card.flip {
        transform: rotateY(180deg);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
        padding: 25px;
        box-sizing: border-box;
        text-align: center;
    }

    .back {
        transform: rotateY(180deg);
    }

    h1 {
        color: white;
        margin-bottom: 15px;
    }

    p {
        color: white;
        font-size: 18px;
        margin-bottom: 20px;
        min-height: 30px;
    }

    .buttons {
        display: flex;
        gap: 15px;
        margin-top: 10px;
    }

    button {
        border: none;
        border-radius: 40px;
        padding: 15px 35px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #yes {
        background: #ff1744;
        color: white;
        font-size: 20px;
    }

    #no {
        background: white;
        color: #ff1744;
    }

    .hearts {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0.7;
    }

    @keyframes float {
        from {
            transform: translateY(100vh);
        }
        to {
            transform: translateY(-10vh);
        }
    }
</style>
</head>

<body>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine? 💖</h1>
            <p id="message">You make my every day brighter ✨</p>

            <div class="buttons">
                <button id="yes">YES 💖</button>
                <button id="no">NO 😜</button>
            </div>
        </div>

        <!-- BACK -->
        <div class="side back">
            <h1>YAYYYYY 💕</h1>
            <p>
                I knew it!!! 🥹💖<br><br>
                You just made me the happiest person alive 💘<br><br>
                I love you endlessly 💞
            </p>
        </div>

    </div>
</div>

<script>
    const noMessages = [
        "Are you sure? 🥺",
        "Think again 😢",
        "My heart is breaking 💔",
        "Pleaseee 🥹",
        "Last chance 😭",
        "Okay… now you HAVE to say yes 😤"
    ];

    let noCount = 0;
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("message");
    const card = document.getElementById("card");

    noBtn.addEventListener("click", () => {
        if (noCount < noMessages.length) {
            msg.innerText = noMessages[noCount];
            noCount++;
            let scale = 1 + noCount * 0.2;
            yesBtn.style.transform = `scale(${scale})`;
        }
    });

    yesBtn.addEventListener("click", () => {
        card.classList.add("flip");
    });

    // floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "hearts";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
</script>

</body>
</html>
