<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<!-- Attractive romantic font -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
    }

    .scene {
        width: 420px;
        height: 420px;
        perspective: 1000px;
        z-index: 2;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s;
    }

    .card.flip {
        transform: rotateY(180deg);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(14px);
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        backface-visibility: hidden;
        padding: 25px;
        box-sizing: border-box;
        text-align: center;
    }

    .back {
        transform: rotateY(180deg);
    }

    h1 {
        font-family: 'Great Vibes', cursive;
        font-size: 46px;
        color: white;
        margin-top: -20px; /* moved UP */
        margin-bottom: 20px;
        text-shadow:
            0 0 10px #fff,
            0 0 20px #ff4d6d,
            0 0 30px #ff1744;
    }

    p {
        color: white;
        font-size: 20px;
        margin-bottom: 20px;
        min-height: 32px;
        text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    .buttons {
        display: flex;
        gap: 15px;
        margin-top: 10px;
    }

    button {
        border: none;
        border-radius: 40px;
        padding: 15px 35px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
    }

    #yes {
        background: #ff1744;
        color: white;
        font-size: 20px;
        box-shadow: 0 0 20px rgba(255,23,68,0.9);
    }

    #no {
        background: white;
        color: #ff1744;
    }

    /* Floating hearts */
    .hearts {
        position: absolute;
        animation: float 6s linear infinite;
        opacity: 0.7;
        pointer-events: none;
    }

    @keyframes float {
        from { transform: translateY(100vh); }
        to { transform: translateY(-10vh); }
    }

    /* Fireworks */
    .firework {
        position: absolute;
        width: 6px;
        height: 6px;
        background: transparent;
        border-radius: 50%;
        box-shadow:
            0 0 10px #fff,
            0 0 20px #ff4d6d,
            0 0 30px #ff1744;
        animation: explode 1s ease-out forwards;
        pointer-events: none;
    }

    @keyframes explode {
        from { transform: scale(0); opacity: 1; }
        to { transform: scale(15); opacity: 0; }
    }
</style>
</head>

<body>

<div class="scene">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="side front">
            <h1>Muskan, Will You Be My Valentine?</h1>
            <p id="message"></p>

            <div class="buttons">
                <button id="yes">YES 💖</button>
                <button id="no">NO 😜</button>
            </div>
        </div>

        <!-- BACK -->
        <div class="side back">
            <h1>Yayyyy 💕</h1>
            <p>
                I Knew It!!! 🥹💖<br><br>
                You Just Made Me The Happiest Person Alive 💘<br><br>
                I Love You Endlessly 💞
            </p>
        </div>

    </div>
</div>

<script>
    const noMessages = [
        "Are You Serious? 😳",
        "Think Again 😢",
        "My Heart Is Breaking 💔",
        "Pleaseee 🥺",
        "Don’t Do This To Me 😭",
        "Okay… Now You Have To Say Yes 😤"
    ];

    let noCount = 0;
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("message");
    const card = document.getElementById("card");

    noBtn.addEventListener("click", () => {
        if (noCount < noMessages.length) {
            msg.innerText = noMessages[noCount];
            noCount++;
            yesBtn.style.transform = `scale(${1 + noCount * 0.25})`;
        }
    });

    yesBtn.addEventListener("click", () => {
        card.classList.add("flip");
        launchFireworks();
    });

    function launchFireworks() {
        for (let i = 0; i < 20; i++) {
            const fw = document.createElement("div");
            fw.className = "firework";
            fw.style.left = Math.random() * 100 + "vw";
            fw.style.top = Math.random() * 100 + "vh";
            document.body.appendChild(fw);
            setTimeout(() => fw.remove(), 1000);
        }
    }

    // Floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "hearts";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 12) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 300);
</script>

</body>
</html>
