<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Calibri, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(255, 0, 90, 0.35);
      transition: transform 0.3s ease;
    }

    .shake {
      animation: shake 0.6s;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(1deg); }
      50% { transform: rotate(-1deg); }
      75% { transform: rotate(1deg); }
      100% { transform: rotate(0deg); }
    }

    h1 {
      color: white;
      font-size: 1.9rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      color: white;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 12px 26px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background: #ff1e56;
      color: white;
      box-shadow: 0 0 15px rgba(255, 30, 86, 0.8);
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.45);
      color: white;
    }

    #message {
      color: white;
      font-size: 1.1rem;
      display: none;
      margin-top: 15px;
      min-height: 40px;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Muskan, Will You Be My Valentine? ❤️</h1>
    <p>You make my heart smile every single day.</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">YES 💖</button>
      <button id="noBtn" onclick="noClicked()">NO 🙃</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    let noCount = 0;
    let yesScale = 1;

    const noMessages = [
      "😲 Are you serious?",
      "😐 Think again…",
      "🥺 That kinda hurt, not gonna lie.",
      "😔 I was so sure you’d say yes.",
      "😩 Okay now you’re just playing with my heart.",
      "❤️ At this point, you know the right answer."
    ];

    function noClicked() {
      const message = document.getElementById("message");
      const yesBtn = document.getElementById("yesBtn");

      message.style.display = "block";
      message.innerHTML = noMessages[Math.min(noCount, noMessages.length - 1)];

      yesScale += 0.25;
      yesBtn.style.transform = `scale(${yesScale})`;

      noCount++;
    }

    function yesClicked() {
      const message = document.getElementById("message");
      const card = document.getElementById("card");

      card.classList.add("shake");

      message.style.display = "block";
      message.innerHTML =
        "🎉 Yay! I knew it 😌💖<br>You just made me the happiest person alive.<br>I love you endlessly ❤️";

      setTimeout(() => {
        card.classList.remove("shake");
      }, 600);
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 400);
  </script>

</body>
</html>
